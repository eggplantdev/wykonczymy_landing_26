services:
  db:
    image: postgres:17-alpine
    container_name: landing26-cms
    ports:
      # 5433/5434/5435 are taken by the leads app, Chaos Kitchen and the leads test db.
      - '5436:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
